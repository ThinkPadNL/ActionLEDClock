substitutions:
  device_name: ledklok
  friendly_name: "LED Klok"
  temperature_entity: sensor.woonkamer_temperatuur

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - clock_logic.h
  project:
    name: "custom.reverse_engineered_led_clock"
    version: "1.1"

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .home.internal
  min_auth_mode: WPA2

# Configue mDNS broadcast
mdns:
  disabled: true

# Enable logging.
logger:

# Enable Home Assistant API
api:
  # Don't reboot when Home Assistant doesn't connect.
  reboot_timeout: 0s

# Enable over-the-air updates.
ota:
  platform: esphome

# Enable Web server.
web_server:
  port: 80

captive_portal:

time:
  - platform: sntp
    id: klok_tijd
    timezone: Europe/Amsterdam
    servers:
      - ntp.home.internal
    on_time_sync:
      then:
        - script.execute: render_clock
    on_time:
      - seconds: /1
        then:
          - script.execute: render_clock

sensor:
  - platform: homeassistant
    id: clock_temperature
    entity_id: ${temperature_entity}
    internal: true

output:
  - platform: template
    id: clock_red_output
    type: float
    write_action:
      - lambda: |-
          // Virtuele output; fysieke LED's worden door render_clock gestuurd.

  - platform: template
    id: clock_green_output
    type: float
    write_action:
      - lambda: |-
          // Virtuele output; fysieke LED's worden door render_clock gestuurd.

  - platform: template
    id: clock_blue_output
    type: float
    write_action:
      - lambda: |-
          // Virtuele output; fysieke LED's worden door render_clock gestuurd.

light:
  - platform: rgb
    id: clock_control
    name: "Klok verlichting"
    red: clock_red_output
    green: clock_green_output
    blue: clock_blue_output
    gamma_correct: 1.0
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      then:
        - script.execute: render_clock

  - platform: neopixelbus
    id: led_r6
    name: "R6"
    internal: true
    type: GRB
    variant: WS2812
    pin: GPIO5
    num_leds: 36
    restore_mode: ALWAYS_OFF

  - platform: neopixelbus
    id: led_r1
    name: "R1"
    internal: true
    type: GRB
    variant: WS2812
    pin: GPIO4
    num_leds: 32
    restore_mode: ALWAYS_OFF

  - platform: neopixelbus
    id: led_r2
    name: "R2"
    internal: true
    type: GRB
    variant: WS2812
    pin: GPIO14
    num_leds: 25
    restore_mode: ALWAYS_OFF

  - platform: neopixelbus
    id: led_r11
    name: "R11"
    internal: true
    type: GRB
    variant: WS2812
    pin: GPIO12
    num_leds: 20
    restore_mode: ALWAYS_OFF

switch:
  - platform: template
    id: show_dst
    name: "Klok DST-indicatie"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - script.execute: render_clock
    turn_off_action:
      - script.execute: render_clock

script:
  - id: render_clock
    mode: restart
    then:
      - lambda: |-
          auto now = id(klok_tijd).now();
          if (!now.is_valid()) {
            return;
          }

          auto *r6 = static_cast<esphome::light::AddressableLight *>(
              id(led_r6).get_output());
          auto *r1 = static_cast<esphome::light::AddressableLight *>(
              id(led_r1).get_output());
          auto *r2 = static_cast<esphome::light::AddressableLight *>(
              id(led_r2).get_output());
          auto *r11 = static_cast<esphome::light::AddressableLight *>(
              id(led_r11).get_output());

          float red = 1.0f;
          float green = 1.0f;
          float blue = 1.0f;

          id(clock_control).current_values_as_rgb(&red, &green, &blue);

          bool light_on = id(clock_control).current_values.is_on();
          bool dst_enabled = id(show_dst).state;

          bool temperature_valid = id(clock_temperature).has_state();
          float temperature = id(clock_temperature).state;

          klok::render_time(
              r6,
              r1,
              r2,
              r11,
              now,
              red,
              green,
              blue,
              light_on,
              dst_enabled,
              temperature,
              temperature_valid);
